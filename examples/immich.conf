# Пример: Immich (релизы на GitHub). Скопируй в apps/immich.conf.
# В .env Immich должно быть IMMICH_VERSION=vN (например v3): этот major
# и отслеживается; на новый major переходишь сам.

[app]
source   = releases
# Раз в день в этом окне. Удобно сразу после снапшота шары с Immich и до
# ночного/дневного бэкапа базы самим Immich.
schedule = 12:20-12:55

dir     = /volume1/docker/immich
project = immich
files   = docker-compose.yml docker-compose.override.yml

github      = immich-app/immich
version_var = IMMICH_VERSION
# Первый — образ сервера; их старые версии удаляются после обновления.
images      = ghcr.io/immich-app/immich-server ghcr.io/immich-app/immich-machine-learning
server_container = immich_server
# Откуда взять работающую версию: переменная окружения в образе сервера.
version_env = IMMICH_SOURCE_REF
# Сервер отвечает версией: так понимаем, что поднялась именно новая.
version_url = http://127.0.0.1:2283/api/server/version

# Ставим релиз, только когда ему исполнилось столько дней.
cooldown_days = 3
# Если в docker-compose.yml из релиза другой образ базы — не ставим сами.
reference_compose = docker-compose.yml
stop_if_image     = postgres

snapshot_max_age = 90
# Сколько ждать, пока новая версия станет healthy (миграции базы).
health_timeout = 900
