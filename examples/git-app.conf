# Пример: приложение из репозитория, куда пушат агенты или CI (недоверенный код).
# Скопируй в apps/<имя>.conf и поправь пути. Имя файла = имя приложения.

[app]
source   = git
# Каждый запуск задачи (каждые 5 минут): новый образ выкатывается сразу.
schedule = always

repo     = /volume1/docker/myapp
repo_url = https://github.com/you/myapp
branch   = main
# Имя compose-проекта задаём сами: down никогда не заденет чужой стек.
project  = myapp

# Главный образ. Коммит деплоится только с образом, собранным из него
# (метка org.opencontainers.image.revision). Его контейнеры идут от run_as.
image        = ghcr.io/you/myapp:latest
# Другие разрешённые образы (шаблоны); они работают так, как в compose.
other_images = nginx:alpine nginx:*-alpine

# Что контейнерам можно монтировать с хоста (вместе с подпапками).
# data: на запись; перед обновлением нужен снапшот шары, где она лежит.
data     = /volume1/homes/you/Data
# Только на чтение, по пути на строку.
readonly = ${repo}/static

# Пользователь DSM для контейнеров главного образа: не root и не в
# administrators. Что ему можно в data, задают ACL в DSM.
run_as        = myapp
# Сервисы главного образа, которым нужен root (cron и т.п.).
root_services = cron

# Локальные файлы, которые git не должен перезаписать никогда.
protected = .env .env.local *.session

snapshot_max_age = 90
# Сколько секунд после up контейнеры должны прожить без перезапусков.
verify_sec = 60

# Отчёт о версии в раздел «Версии» админки сайта (report.py): после обновления,
# отката или блокировки и раз в heartbeat_hours — «жив». Ключ — VERSIONS_KEY сайта
# в файле только для root (или key = … прямо здесь).
[report]
url             = https://daetotyoma.com/admin/versions/myapp-nas
key_file        = /volume1/docker/nas-update/secrets/versions.key
heartbeat_hours = 24
